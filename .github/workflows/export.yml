name: Export Jobat JSON

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run export
        env:
          # Enkel de token is geheim. Base-ID's, tabel- en viewnamen staan hier
          # bewust hardgecodeerd: ze zijn niet gevoelig, en als secret waren ze
          # onzichtbaar én fout (de tabel heette vroeger "Courses").
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}

          # --- bron 1: Opleidingsportfolio KdG V2 ---
          AIRTABLE_BASE_ID: "appBu1JAcv2ArUIDW"
          AIRTABLE_TABLE_NAME: "Opleidingsaanbod website"
          AIRTABLE_VIEW_NAME: "Published_Jobat"
          AIRTABLE_SESSIONS_TABLE_NAME: "Sessions voor Json"
          AIRTABLE_SESSIONS_COURSE_LINK_FIELD: "Course"

          # --- bron 2: navormingen en studiedagen ---
          # Laat NAV_BASE_ID leeg om deze bron uit te schakelen.
          NAV_BASE_ID: "appoAYbpgMH4We38B"
          NAV_TABLE_NAME: "Opleidingsaanbod website"
          NAV_SESSIONS_TABLE_NAME: "Sessions voor Json"
          NAV_SESSIONS_COURSE_LINK_FIELD: "Course"
          NAV_VIEW_NAME_JOBAT: "Published_Jobat"
        run: python scripts/export_jobat.py

      - name: Commit changes if any
        run: |
          git add data/jobat.json
          git diff --cached --quiet || (
            git config user.name "jobat-bot"
            git config user.email "jobat-bot@users.noreply.github.com"
            git commit -m "Update Jobat JSON"
            git push
          )

      # Faalmelding: opent één issue zodra de export stukloopt, en houdt het
      # daarbij — geen nieuw issue of commentaar per mislukte uurrun.
      - name: Meld mislukking als issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- auto-export-failure:jobat -->';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'export-failure', per_page: 100
            });
            if (issues.some(i => (i.body || '').includes(marker))) {
              core.info('Er staat al een issue open voor deze export.');
              return;
            }
            await github.rest.issues.create({
              owner, repo,
              title: 'Export Jobat JSON faalt',
              labels: ['export-failure'],
              body: [
                marker,
                '',
                `De workflow **${context.workflow}** is mislukt.`,
                '',
                'Zolang dit issue openstaat wordt `data/jobat.json` niet meer bijgewerkt,',
                'en krijgt Jobat dus verouderde vacatures.',
                '',
                `- Mislukte run: ${runUrl}`,
                `- Tijdstip: ${new Date().toISOString().slice(0, 16).replace('T', ' ')} UTC`,
                '',
                'Dit issue sluit zichzelf zodra een run opnieuw slaagt.'
              ].join('\n')
            });

      - name: Sluit issue bij herstel
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- auto-export-failure:jobat -->';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'export-failure', per_page: 100
            });
            for (const issue of issues.filter(i => (i.body || '').includes(marker))) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Hersteld — de export is weer geslaagd.\n\nRun: ${runUrl}`
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed'
              });
            }

permissions:
  contents: write
  issues: write
