name: Export Smartlions JSON

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run Smartlions export
        env:
          # Enkel de token is geheim; de rest staat bewust hardgecodeerd.
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}

          # --- bron 1: Opleidingsportfolio KdG V2 ---
          AIRTABLE_BASE_ID: "appBu1JAcv2ArUIDW"
          AIRTABLE_TABLE_NAME: "Opleidingsaanbod website"
          AIRTABLE_SESSIONS_TABLE_NAME: "Sessions voor Json"
          AIRTABLE_SESSIONS_COURSE_LINK_FIELD: "Course"
          AIRTABLE_VIEW_NAME_SMARTLIONS: "Published_Smartlions"
          # De sessies-tabel heeft maar één view; leeg laten = alle sessies ophalen
          # en filteren op de koppeling. Dat is robuuster dan een viewnaam.
          AIRTABLE_SESSIONS_VIEW_NAME_SMARTLIONS: ""

          # --- bron 2: navormingen en studiedagen ---
          # Laat NAV_BASE_ID leeg om deze bron uit te schakelen.
          NAV_BASE_ID: "appoAYbpgMH4We38B"
          NAV_TABLE_NAME: "Opleidingsaanbod website"
          NAV_SESSIONS_TABLE_NAME: "Sessions voor Json"
          NAV_SESSIONS_COURSE_LINK_FIELD: "Course"
          NAV_VIEW_NAME_SMARTLIONS: "Published_Smartlions"
        run: python scripts/export_smartlions.py

      - name: Commit changes if any
        run: |
          git config user.name "smartlions-bot"
          git config user.email "smartlions-bot@users.noreply.github.com"
          git add data/smartlions.json
          git diff --cached --quiet || (
            git commit -m "Update Smartlions JSON"
            git push
          )

      # Faalmelding: opent één issue zodra de export stukloopt, en houdt het
      # daarbij — geen nieuw issue of commentaar per mislukte uurrun.
      - name: Meld mislukking als issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- auto-export-failure:smartlions -->';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'export-failure', per_page: 100
            });
            if (issues.some(i => (i.body || '').includes(marker))) {
              core.info('Er staat al een issue open voor deze export.');
              return;
            }
            await github.rest.issues.create({
              owner, repo,
              title: 'Export Smartlions JSON faalt',
              labels: ['export-failure'],
              body: [
                marker,
                '',
                `De workflow **${context.workflow}** is mislukt.`,
                '',
                'Zolang dit issue openstaat wordt `data/smartlions.json` niet meer bijgewerkt.',
                '',
                `- Mislukte run: ${runUrl}`,
                `- Tijdstip: ${new Date().toISOString().slice(0, 16).replace('T', ' ')} UTC`,
                '',
                'Dit issue sluit zichzelf zodra een run opnieuw slaagt.'
              ].join('\n')
            });

      - name: Sluit issue bij herstel
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- auto-export-failure:smartlions -->';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'export-failure', per_page: 100
            });
            for (const issue of issues.filter(i => (i.body || '').includes(marker))) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Hersteld — de export is weer geslaagd.\n\nRun: ${runUrl}`
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed'
              });
            }
